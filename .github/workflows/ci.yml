name: CI

on:
  push:
    # Avoid duplicate builds on PRs.
    branches:
      - main
  pull_request:

jobs:
  check_publishable:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        # Most of the time this will be a no-op, since GitHub releases new images every week
        # which include the latest stable release of Rust, Rustup, Clippy and rustfmt.
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Check cargo publish
        run: cargo publish --dry-run

  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        # Most of the time this will be a no-op, since GitHub releases new images every week
        # which include the latest stable release of Rust, Rustup, Clippy and rustfmt.
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Clippy
        # Using --all-targets so tests are checked and --deny to fail on warnings.
        # Not using --locked here and below since Cargo.lock is in .gitignore.
        run: cargo clippy --all-targets --all-features -- --deny warnings
      - name: rustfmt
        run: cargo fmt -- --check
      - name: Check docs
        # Using RUSTDOCFLAGS until `cargo doc --check` is stabilised:
        # https://github.com/rust-lang/cargo/issues/10025
        run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --document-private-items --no-deps

  unit-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run unit tests
        run: cargo test --all-features

  windows-check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Clippy (Windows target)
        # which_problem feature omitted: that dependency is Unix-only
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- --deny warnings

  msrv:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install MSRV toolchain
        # Pinned to the `rust-version` declared in Cargo.toml. Unlike the other
        # jobs (which `rustup update` to latest stable), this enforces the MSRV
        # and catches code that silently raises the floor.
        run: rustup toolchain install 1.87 --profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Build and test on MSRV
        run: cargo +1.87 test --all-features

  nightly-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Run unit tests on nightly
        # GitHub's default bash runs with `-o pipefail`, so a cargo failure
        # (including the gated test failing to compile) still fails this step.
        run: cargo +nightly test --all-features 2>&1 | tee nightly-test-output.txt
      - name: Ensure the command_resolved_envs feature was actually exercised
        # Guards against the build.rs probe silently failing: if detection breaks,
        # the gated test compiles out, this line is absent, and CI goes red.
        # Coupled to the test name in src/lib.rs (update both together).
        run: |
          grep -q 'get_resolved_envs_detects_nightly_feature ... ok' nightly-test-output.txt \
            || { echo "::error::command_resolved_envs gated test did not run; feature detection may be broken or the feature changed"; exit 1; }

  readme-updated:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Rust toolchain
        run: rustup update
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
      - name: Install cargo readme
        run: |
          cargo install cargo-rdme
          cargo rdme install-rust-toolchain-for-intralinks
      - name: Check if README.md is up-to-date (see README.md for updating instructions)
        run: cargo rdme --check
